name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "13 11 * * 2"

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      # This profile repository contains documentation and workflows, not application source.
      enable_semgrep: false
