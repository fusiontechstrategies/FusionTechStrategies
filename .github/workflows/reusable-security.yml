name: Reusable Security Scanners

on:
  workflow_call:
    inputs:
      enable_semgrep:
        description: Run Semgrep CE.
        required: false
        type: boolean
        default: true
      enable_trivy:
        description: Run Trivy against source, configuration, secrets, and dependency files.
        required: false
        type: boolean
        default: true
      enable_gitleaks:
        description: Run Gitleaks against all reachable Git history.
        required: false
        type: boolean
        default: true
      semgrep_config:
        description: Semgrep registry configuration or repository-relative configuration file.
        required: false
        type: string
        default: auto
      semgrep_targets:
        description: Newline-delimited repository-relative paths for Semgrep.
        required: false
        type: string
        default: .
      semgrep_exclude_rules:
        description: Newline-delimited Semgrep rule identifiers to exclude with documented rationale.
        required: false
        type: string
        default: ""
      retention_days:
        description: Number of days to retain scanner evidence.
        required: false
        type: number
        default: 90

permissions:
  contents: read
  security-events: write

concurrency:
  group: reusable-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep security analysis
    if: inputs.enable_semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 # v1.175.0
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for security and correctness defects
        id: semgrep-scan
        continue-on-error: true
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
          SEMGREP_TARGETS: ${{ inputs.semgrep_targets }}
          SEMGREP_EXCLUDE_RULES: ${{ inputs.semgrep_exclude_rules }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(printf '%s\n' "$SEMGREP_TARGETS" | sed '/^[[:space:]]*$/d')
          if (( ${#targets[@]} == 0 )); then
            echo "At least one Semgrep target is required." >&2
            exit 2
          fi
          args=(
            scan
            --config "$SEMGREP_CONFIG"
            --error
            --strict
            --metrics=off
            --jobs 2
            --max-memory 4000
            --timeout 10
            --sarif-output semgrep-results.sarif
          )
          while IFS= read -r rule; do
            if [[ -n "$rule" ]]; then
              args+=(--exclude-rule "$rule")
            fi
          done <<< "$SEMGREP_EXCLUDE_RULES"
          semgrep "${args[@]}" "${targets[@]}"

      - name: Upload Semgrep results to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Preserve Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results-${{ github.sha }}
          path: semgrep-results.sarif
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Enforce Semgrep result
        if: steps.semgrep-scan.outcome == 'failure'
        run: exit 1

  trivy:
    name: Trivy source and configuration scan
    if: inputs.enable_trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan source, configuration, secrets, and dependency files
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Preserve Trivy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Enforce Trivy result
        if: steps.trivy-scan.outcome == 'failure'
        run: exit 1

  gitleaks:
    name: Gitleaks full-history scan
    if: inputs.enable_gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_$GITLEAKS_VERSION_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Scan every reachable revision
        id: gitleaks-scan
        continue-on-error: true
        run: >-
          gitleaks git --redact=100 --no-banner --timeout 600
          --report-format sarif --report-path gitleaks-results.sarif
          --log-opts="--all" .

      - name: Upload Gitleaks results to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Preserve Gitleaks results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results-${{ github.sha }}
          path: gitleaks-results.sarif
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Enforce Gitleaks result
        if: steps.gitleaks-scan.outcome == 'failure'
        run: exit 1

  required:
    name: Security scanners
    if: always()
    needs: [semgrep, trivy, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm every enabled scanner succeeded
        env:
          ENABLE_SEMGREP: ${{ inputs.enable_semgrep }}
          ENABLE_TRIVY: ${{ inputs.enable_trivy }}
          ENABLE_GITLEAKS: ${{ inputs.enable_gitleaks }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENABLE_SEMGREP" == "true" ]]; then
            [[ "$SEMGREP_RESULT" == "success" ]]
          else
            [[ "$SEMGREP_RESULT" == "skipped" ]]
          fi
          if [[ "$ENABLE_TRIVY" == "true" ]]; then
            [[ "$TRIVY_RESULT" == "success" ]]
          else
            [[ "$TRIVY_RESULT" == "skipped" ]]
          fi
          if [[ "$ENABLE_GITLEAKS" == "true" ]]; then
            [[ "$GITLEAKS_RESULT" == "success" ]]
          else
            [[ "$GITLEAKS_RESULT" == "skipped" ]]
          fi
